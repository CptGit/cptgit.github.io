---
layout: default
title: Staff
---
<h1>{{ page.title }}</h1>

<ul class="staff">
  {%- for author in site.authors -%}
    <li>
      <h2><a href="{{ author.url | relative_url }}">{{ author.name-en }}</a></h2>
      {%- if author.position -%}<h3>{{ author.position }}</h3>{%- endif -%}
      {%- include utils/markdownify-with-removing-p-tag.html text=author.content -%}
    </li>
  {%- endfor -%}
</ul>
